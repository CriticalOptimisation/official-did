<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<link rel="canonical" href="{{DID_REDIRECT}}">
<meta name="robots" content="noindex">
<!-- {{DID_DOMAIN}} hosts no website. It carries the issuer's did:web identifier,
     served at /.well-known/did.json. Every human visit goes on to {{DID_REDIRECT_HOST}}.
     The meta refresh works without JavaScript; the link stays clickable if the
     browser has disabled it. -->
<meta http-equiv="refresh" content="0; url={{DID_REDIRECT}}">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 4rem auto; max-width: 32rem; padding: 0 1rem; }
</style>
<p>Redirecting to <a href="{{DID_REDIRECT}}">{{DID_REDIRECT_HOST}}</a>.</p>
